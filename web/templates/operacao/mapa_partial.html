{% if coletas %}
<div id="mapa-operacao" style="height: 320px; width: 100%;"></div>
{% else %}
<div class="text-muted text-center py-5">Sem coletas para exibir no mapa nesta data.</div>
{% endif %}

{% if coletas %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var pontos = [
    {% for c in coletas if c.latitude is not none %}
    {
      lat: {{ c.latitude }},
      lng: {{ c.longitude }},
      nome: {{ c.ponto_nome|tojson }},
      bairro: {{ (c.bairro or '')|tojson }},
      codigo: {{ c.codigo|tojson }},
      status: {{ c.status|tojson }},
      url: {{ url_for('coletas.detalhe', cid=c.id)|tojson }}
    }{% if not loop.last %},{% endif %}
    {% endfor %}
  ];

  var map = L.map('mapa-operacao').setView([-19.9167, -43.9345], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  var cores = {
    agendada: '#0d6efd',
    em_andamento: '#fd7e14',
    concluida: '#198754',
    cancelada: '#6c757d'
  };
  var bounds = [];
  pontos.forEach(function (p) {
    var m = L.circleMarker([p.lat, p.lng], {
      radius: 8,
      color: cores[p.status] || '#333',
      fillOpacity: 0.85
    }).addTo(map);
    m.bindPopup('<strong>' + p.codigo + '</strong><br>' + p.nome +
      '<br>' + p.bairro + '<br><a href="' + p.url + '">Abrir</a>');
    bounds.push([p.lat, p.lng]);
  });
  if (bounds.length) map.fitBounds(bounds, { padding: [24, 24] });
  if (!pontos.length) {
    document.getElementById('mapa-operacao').innerHTML =
      '<div class="text-muted text-center py-5">Nenhum ponto com coordenadas.</div>';
  }
})();
</script>
{% endif %}
