{% extends "base.html" %}
{% block title %}Usuários{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Usuários</h1>
  <a href="{{ url_for('cadastros.usuario_novo') }}" class="btn btn-primary">Novo</a>
</div>
<div class="card">
  <div class="table-responsive">
    <table class="table table-sm mb-0 align-middle">
      <thead class="table-light">
        <tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Ativo</th><th>Criado em</th></tr>
      </thead>
      <tbody>
        {% for r in rows %}
        <tr>
          <td>{{ r.nome }}</td>
          <td>{{ r.email }}</td>
          <td><span class="badge text-bg-primary">{{ r.perfil }}</span></td>
          <td>{{ 'Sim' if r.ativo else 'Não' }}</td>
          <td>{{ r.criado_em }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
<a href="{{ url_for('cadastros.index') }}" class="btn btn-link mt-3">← Voltar</a>
{% endblock %}
