{% extends "base.html" %}
{% block title %}{{ 'Editar' if row else 'Novo' }} veículo{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ 'Editar veículo' if row else 'Novo veículo' }}</h1>
<form method="post" class="col-md-6">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <div class="mb-3">
    <label class="form-label">Placa *</label>
    <input name="placa" class="form-control text-uppercase" required value="{{ row.placa if row else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Tipo *</label>
    <select name="tipo" class="form-select" required>
      {% for t in tipos %}
      <option value="{{ t }}" {% if row and row.tipo == t %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Descrição</label>
    <input name="descricao" class="form-control" value="{{ row.descricao if row and row.descricao else '' }}">
  </div>
  <div class="row">
    <div class="col mb-3">
      <label class="form-label">Capacidade (kg)</label>
      <input type="number" step="0.001" name="capacidade_kg" class="form-control" value="{{ row.capacidade_kg if row and row.capacidade_kg else '' }}">
    </div>
    <div class="col mb-3">
      <label class="form-label">Execução padrão (min) *</label>
      <input type="number" name="tempo_execucao_padrao_minutos" class="form-control" required value="{{ row.tempo_execucao_padrao_minutos if row else 30 }}">
    </div>
  </div>
  <div class="form-check mb-3">
    <input type="checkbox" class="form-check-input" name="terceirizado" id="terc" {% if row and row.terceirizado %}checked{% endif %}>
    <label class="form-check-label" for="terc">Terceirizado</label>
  </div>
  {% if row %}
  <div class="form-check mb-3">
    <input type="checkbox" class="form-check-input" name="ativo" id="ativo" {% if row.ativo %}checked{% endif %}>
    <label class="form-check-label" for="ativo">Ativo</label>
  </div>
  {% endif %}
  <button class="btn btn-primary">Salvar</button>
  <a href="{{ url_for('cadastros.veiculos') }}" class="btn btn-link">Cancelar</a>
</form>
{% endblock %}
