{% extends "base.html" %}
{% block title %}Novo usuário{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Novo usuário</h1>
<form method="post" class="col-md-6">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <div class="mb-3">
    <label class="form-label">Nome *</label>
    <input name="nome" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">E-mail *</label>
    <input type="email" name="email" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Senha * (mín. 6)</label>
    <input type="password" name="senha" class="form-control" minlength="6" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Perfil *</label>
    <select name="perfil" class="form-select" required>
      {% for p in perfis %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
    </select>
  </div>
  <button class="btn btn-primary">Criar</button>
  <a href="{{ url_for('cadastros.usuarios') }}" class="btn btn-link">Cancelar</a>
</form>
{% endblock %}
